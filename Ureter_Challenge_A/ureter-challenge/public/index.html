<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URETER CHALLENGE</title><style>:root{font-family:system-ui,Arial;background:#0b1226;color:white}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(650px,100%);background:#172440;border:1px solid #34476a;border-radius:22px;padding:28px;box-shadow:0 15px 55px #050817}h1{font-size:clamp(28px,6vw,45px);margin:8px 0;color:#70e7fa}h2{font-size:clamp(20px,4vw,27px)}p{color:#cbd5e1;line-height:1.5}input{width:100%;padding:15px;border-radius:12px;border:1px solid #64748b;background:#0e1930;color:white;font-size:18px}button{cursor:pointer;border:0;border-radius:13px;padding:15px;font-weight:700;font-size:16px;color:white;background:#2463eb}button:disabled{opacity:.5;cursor:default}.wide{width:100%;margin-top:14px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.answers button{min-height:100px;text-align:left}.answers button:nth-child(1){background:#2365c9}.answers button:nth-child(2){background:#b52c60}.answers button:nth-child(3){background:#b67a1c}.answers button:nth-child(4){background:#16836b}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.timer{font-size:24px;font-weight:800;color:#67e8f9}.bar{height:8px;border-radius:9px;background:#34476a;overflow:hidden}.fill{height:100%;background:#67e8f9;transition:width .2s}.muted{font-size:13px;color:#94a3b8}.success{color:#5eead4}.error{color:#fda4af}.leader{width:100%;border-collapse:collapse}.leader td{border-bottom:1px solid #34476a;padding:12px}.hide{display:none}@media(max-width:420px){.panel{padding:20px}.answers{gap:8px}.answers button{font-size:14px;padding:10px}}</style></head><body><main class="panel"><div class="top"><span class="muted">ANATOMÍA · JUEGO INDIVIDUAL</span><span>💧</span></div><h1>URETER CHALLENGE</h1><div id="start"><p>20 preguntas · 15 segundos cada una · puntuación por rapidez y precisión. ¡Demuestra cuánto sabes!</p><form id="form"><label for="name">Tu nombre o apodo</label><input id="name" maxlength="25" placeholder="Ej. Ana" required autocomplete="nickname"><button class="wide">🚀 ¡JUGAR!</button></form></div><div id="game" class="hide"><div class="top"><span id="progress"></span><span class="timer" id="time">15 s</span></div><div class="bar"><div id="fill" class="fill"></div></div><h2 id="question"></h2><div id="answers" class="answers"></div><div class="muted" id="score"></div></div><div id="result" class="hide"><h2 id="finishTitle"></h2><p id="finishScore"></p><h2>🏆 Clasificación</h2><p class="muted">Jugadores que terminaron mientras este servidor estuvo activo.</p><table class="leader" id="leader"></table><button class="wide" onclick="restart()">Volver a jugar</button></div><p class="error" id="error" role="alert"></p></main><script>let token=null,state=null,ticker=null,waiting=false;const el=id=>document.getElementById(id);function show(id){['start','game','result'].forEach(x=>el(x).classList.toggle('hide',x!==id))}async function api(route,data){let r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let v=await r.json();if(!r.ok)throw Error(v.error||'Error de conexión');return v}el('form').onsubmit=async e=>{e.preventDefault();try{el('error').textContent='';let v=await api('start',{name:el('name').value});token=v.token;state=v;render()}catch(e){el('error').textContent=e.message}};function render(){if(state.done){clearInterval(ticker);show('result');el('finishTitle').textContent='🎉 ¡Terminaste, '+state.name+'!';el('finishScore').textContent='Puntuación: '+state.score+' / 20 000 puntos';el('leader').innerHTML=(state.leaderboard||[]).map(x=>'<tr><td>'+x.rank+'</td><td>'+escapeHTML(x.name)+'</td><td>'+x.score+'</td></tr>').join('');return}show('game');el('progress').textContent='PREGUNTA '+(state.index+1)+' / '+state.total;el('fill').style.width=(100*state.index/state.total)+'%';el('question').textContent=state.question.q;el('score').textContent='⭐ '+state.score+' puntos';el('answers').innerHTML='';state.question.a.forEach((a,i)=>{let b=document.createElement('button');b.textContent=['▲ ','◆ ','● ','■ '][i]+a;b.onclick=()=>answer(i);el('answers').append(b)});clearInterval(ticker);waiting=false;tick();ticker=setInterval(tick,120)}function tick(){if(!state||state.done)return;let ms=Math.max(0,state.deadline-Date.now());el('time').textContent=(ms/1000).toFixed(1)+' s';if(ms<=0&&!waiting)answer(-1)}async function answer(choice){if(waiting)return;waiting=true;[...el('answers').children].forEach(b=>b.disabled=true);try{let next=await api('answer',{token,choice});state=next;render()}catch(e){el('error').textContent=e.message;waiting=false}}function restart(){token=null;state=null;clearInterval(ticker);show('start')}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
